    <path d="M116 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M116 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 112l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 136l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
  </g>
  <text x="128" y="120">YOLOv11 vehicle detection &amp; counting</text>
  <text x="128" y="144">Rush / No-Rush density classification</text>
  <text x="128" y="168">Real-time statistics overlay</text>
  <text x="128" y="192">Uploaded video file input</text>
  <text x="426" y="120">Live webcam / camera feed analysis</text>
  <text x="426" y="144">OpenCV frame-by-frame processing</text>
  <text x="426" y="168">Streamlit web dashboard interface</text>
  <text x="426" y="192">Pretrained yolo11l.pt weights</text>
</g>

