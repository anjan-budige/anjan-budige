<circle cx="736" cy="84" r="3.5" fill="#06B6D4"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="748" y="88" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#7DD3FC" letter-spacing="1.4">LIVE FRAME INFERENCE</text>

