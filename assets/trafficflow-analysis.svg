<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Traffic Flow Analysis: Python, Streamlit, YOLOv11, OpenCV. Real-time vehicle detection and counting from video files or live camera feeds with Rush or Safe classification.">
<defs>
  <linearGradient id="tf-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071129"/>
    <stop offset="52%" stop-color="#0A1836"/>
    <stop offset="100%" stop-color="#060C1B"/>
  </linearGradient>
  <linearGradient id="tf-ac" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <linearGradient id="tf-bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#0891B2" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="tf-sh" x1="0" y1="0" x2="1" y2="0">
