    <stop offset="100%" stop-color="#0B1834"/>
  </linearGradient>
  <linearGradient id="tf-road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0C1C38"/>
    <stop offset="100%" stop-color="#081226"/>
  </linearGradient>
  <radialGradient id="tf-g1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tf-g2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tf-ic" cx="50%" cy="50%" r="50%">
