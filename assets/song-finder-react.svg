<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Song Finder React: React, Axios, Cheerio, Tailwind, Web Bluetooth. Live music search across JioSaavn and Gaana with genre suggestions and Bluetooth navigation. Live demo on Netlify.">
