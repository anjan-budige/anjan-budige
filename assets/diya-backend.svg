  <rect x="822" y="0" width="10" height="24" rx="5"><animate attributeName="height" values="24;50;30;64;24" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="838" y="0" width="10" height="48" rx="5"><animate attributeName="height" values="48;70;26;54;48" dur="1.5s" repeatCount="indefinite"/></rect>
  <rect x="854" y="0" width="10" height="36" rx="5"><animate attributeName="height" values="36;22;60;44;36" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="870" y="0" width="10" height="62" rx="5"><animate attributeName="height" values="62;34;52;26;62" dur="1.8s" repeatCount="indefinite"/></rect>
  <rect x="886" y="0" width="10" height="28" rx="5"><animate attributeName="height" values="28;56;38;68;28" dur="2.2s" repeatCount="indefinite"/></rect>
  <rect x="902" y="0" width="10" height="50" rx="5"><animate attributeName="height" values="50;26;64;36;50" dur="1.6s" repeatCount="indefinite"/></rect>
  <rect x="918" y="0" width="10" height="38" rx="5"><animate attributeName="height" values="38;62;28;54;38" dur="2.5s" repeatCount="indefinite"/></rect>
</g>
<line x1="736" y1="180" x2="950" y2="180" stroke="#1E3A8A" stroke-width="1"/>
<text x="736" y="196" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#5B7BA8">/api/vibe · /api/playlists · /api/analytics</text>

<line x1="30" y1="212" x2="970" y2="212" stroke="#16294D" stroke-width="1"/>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#A9C6EE" text-anchor="middle">
  <rect x="30" y="226" width="76" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="68" y="243">Node.js</text>
  <rect x="116" y="226" width="76" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="154" y="243">Express</text>
  <rect x="202" y="226" width="94" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="249" y="243">PostgreSQL</text>
  <rect x="306" y="226" width="72" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="342" y="243">Prisma</text>
  <rect x="388" y="226" width="88" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="432" y="243">Socket.IO</text>
  <rect x="486" y="226" width="56" height="26" rx="13" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/><text x="514" y="243">JWT</text>
</g>

<a href="https://github.com/anjan-budige/diya-backend" target="_blank">
  <rect x="838" y="226" width="132" height="26" rx="13" fill="url(#dy-ac)" opacity="0.92"/>
  <text x="904" y="243" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#04122B" text-anchor="middle" letter-spacing="0.6">VIEW SOURCE</text>
