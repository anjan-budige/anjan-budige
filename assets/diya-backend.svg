<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Diya Music App Backend: Node.js, Express, PostgreSQL, Prisma, Socket.IO. JWT auth, collaborative playlists, real-time vibe sessions, listening analytics.">
<defs>
  <linearGradient id="dy-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0A1128"/>
    <stop offset="52%" stop-color="#0B1631"/>
    <stop offset="100%" stop-color="#070D1D"/>
  </linearGradient>
  <linearGradient id="dy-ac" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="dy-bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#2563EB"/>
  </linearGradient>
  <linearGradient id="dy-bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#0E7490" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="dy-sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#BFDBFE" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dy-chip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#14254A"/>
    <stop offset="100%" stop-color="#0D1A36"/>
  </linearGradient>
  <radialGradient id="dy-g1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#2563EB" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dy-g2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dy-ic" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dy-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0v26" fill="none" stroke="#1E40AF" stroke-opacity="0.15" stroke-width="1"/>
  </pattern>
  <clipPath id="dy-clip"><rect x="2" y="2" width="996" height="276" rx="18"/></clipPath>
</defs>

<rect x="2" y="2" width="996" height="276" rx="18" fill="url(#dy-bg)"/>
<g clip-path="url(#dy-clip)">
  <rect x="2" y="2" width="996" height="276" fill="url(#dy-grid)"/>
  <circle cx="90" cy="60" r="190" fill="url(#dy-ic)"/>
  <ellipse cx="940" cy="240" rx="260" ry="150" fill="url(#dy-g1)"/>
  <ellipse cx="620" cy="10" rx="230" ry="120" fill="url(#dy-g2)"/>

  <g fill="#7DD3FC">
    <circle cx="690" cy="40" r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="668" cy="196" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="96" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="26" cy="228" r="1.4" opacity="0.35"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-500" y="-60" width="230" height="420" fill="url(#dy-sh)" transform="skewX(-18)">
    <animate attributeName="x" from="-500" to="1250" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="2" y="2" width="996" height="276" rx="18" fill="none" stroke="url(#dy-bd)" stroke-width="1.5"/>
<rect x="2" y="2" width="996" height="276" rx="18" fill="none" stroke="url(#dy-ac)" stroke-width="2" stroke-linecap="round" stroke-dasharray="170 2400" opacity="0.9">
  <animate attributeName="stroke-dashoffset" from="0" to="-2570" dur="8s" repeatCount="indefinite"/>
</rect>

<g stroke="url(#dy-ac)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
  <path d="M20 40V30a10 10 0 0 1 10-10h10"/>
  <path d="M980 240v10a10 10 0 0 1-10 10h-10"/>
</g>

<g transform="translate(49,49)" fill="#FFFFFF">
  <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
</g>
<rect x="30" y="30" width="62" height="62" rx="16" fill="none" stroke="url(#dy-ac)" stroke-width="1.2" opacity="0.65"/>
<circle cx="61" cy="61" r="46" fill="url(#dy-ic)" opacity="0.5">
  <animate attributeName="opacity" values="0.25;0.6;0.25" dur="4s" repeatCount="indefinite"/>
</circle>

<text x="112" y="52" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#F8FAFC" letter-spacing="0.2">Diya Music App Backend</text>
<text x="112" y="76" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6C8">REST + real-time API layer for a full music streaming platform</text>

<rect x="742" y="26" width="228" height="24" rx="12" fill="url(#dy-chip)" stroke="#1E3A8A" stroke-width="1"/>
<circle cx="758" cy="38" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="770" y="42" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#7DD3FC" letter-spacing="1.3">BACKEND · REST + WEBSOCKET</text>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#C7D6EC">
  <g fill="#38BDF8">
    <path d="M116 112l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M116 136l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M116 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M116 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 112l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 136l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
  </g>
  <text x="128" y="120">JWT auth, profiles &amp; privacy controls</text>
  <text x="128" y="144">Liked songs, albums, artists, playlists</text>
  <text x="128" y="168">Collaborative multi-user playlists</text>
  <text x="128" y="192">Real-time Vibe Sessions via Socket.IO</text>
  <text x="426" y="120">Play history &amp; listening analytics</text>
  <text x="426" y="144">Social follow + music discovery feed</text>
  <text x="426" y="168">Prisma ORM on PostgreSQL, migrations</text>
  <text x="426" y="192">30+ REST endpoints, bcrypt hashing</text>
</g>

<rect x="716" y="62" width="254" height="140" rx="14" fill="#0A1428" fill-opacity="0.72" stroke="#1E3A8A" stroke-width="1"/>
<circle cx="736" cy="84" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="748" y="88" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#7DD3FC" letter-spacing="1.4">LIVE SYNC ENGINE</text>
<g transform="translate(0,180) scale(1,-1)" fill="url(#dy-bar)">
  <rect x="758" y="0" width="10" height="26" rx="5"><animate attributeName="height" values="26;58;34;70;26" dur="1.9s" repeatCount="indefinite"/></rect>
  <rect x="774" y="0" width="10" height="44" rx="5"><animate attributeName="height" values="44;20;62;30;44" dur="2.3s" repeatCount="indefinite"/></rect>
