<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="SkillUp Educational Task Management Platform: React, Vite, Tailwind, Node.js, Express, MongoDB. Admin, Faculty and Student portals with role-based access, grading and analytics.">
<defs>
  <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B1030"/>
    <stop offset="52%" stop-color="#0C1738"/>
    <stop offset="100%" stop-color="#070C1E"/>
  </linearGradient>
  <linearGradient id="sk-ac" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#818CF8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="sk-bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#4338CA"/>
  </linearGradient>
  <linearGradient id="sk-bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4338CA" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#0E7490" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="sk-sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#C7D2FE" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sk-chip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#17204A"/>
    <stop offset="100%" stop-color="#0E1738"/>
  </linearGradient>
  <radialGradient id="sk-g1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#4338CA" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sk-g2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sk-ic" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="sk-grid" width="26" height="26" patternUnits="userSpaceOnUse">
