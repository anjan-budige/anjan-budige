  <rect x="919" y="0" width="18" height="62" rx="4"><animate attributeName="height" values="62;44;70;62" dur="3s" repeatCount="indefinite"/></rect>
</g>

<polyline points="758,142 792,124 826,132 860,110 894,118 928,98" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" opacity="0.9">
  <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/>
</polyline>

<line x1="736" y1="178" x2="950" y2="178" stroke="#3730A3" stroke-width="1"/>
<text x="736" y="196" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#6479AE">courses · batches · tasks · grades</text>

<line x1="30" y1="212" x2="970" y2="212" stroke="#1B2450" stroke-width="1"/>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#B4C0EE" text-anchor="middle">
  <rect x="30" y="226" width="62" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="61" y="243">React</text>
  <rect x="102" y="226" width="54" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="129" y="243">Vite</text>
  <rect x="166" y="226" width="80" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="206" y="243">Tailwind</text>
  <rect x="256" y="226" width="112" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="312" y="243">Framer Motion</text>
  <rect x="378" y="226" width="76" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="416" y="243">Node.js</text>
  <rect x="464" y="226" width="76" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="502" y="243">Express</text>
  <rect x="550" y="226" width="86" height="26" rx="13" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/><text x="593" y="243">MongoDB</text>
</g>

<a href="https://github.com/anjan-budige/educational-task-management" target="_blank">
  <rect x="838" y="226" width="132" height="26" rx="13" fill="url(#sk-ac)" opacity="0.92"/>
  <text x="904" y="243" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#080F2E" text-anchor="middle" letter-spacing="0.6">VIEW SHOWCASE</text>
