    <circle cx="668" cy="196" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="96" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="26" cy="228" r="1.4" opacity="0.35"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="6.4s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-500" y="-60" width="230" height="420" fill="url(#sk-sh)" transform="skewX(-18)">
    <animate attributeName="x" from="-500" to="1250" dur="7.5s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="2" y="2" width="996" height="276" rx="18" fill="none" stroke="url(#sk-bd)" stroke-width="1.5"/>
<rect x="2" y="2" width="996" height="276" rx="18" fill="none" stroke="url(#sk-ac)" stroke-width="2" stroke-linecap="round" stroke-dasharray="170 2400" opacity="0.9">
