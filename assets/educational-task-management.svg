  <circle cx="90" cy="60" r="190" fill="url(#sk-ic)"/>
  <ellipse cx="940" cy="240" rx="260" ry="150" fill="url(#sk-g1)"/>
  <ellipse cx="620" cy="10" rx="230" ry="120" fill="url(#sk-g2)"/>

  <g fill="#A5B4FC">
