</rect>

<g stroke="url(#sk-ac)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
  <path d="M20 40V30a10 10 0 0 1 10-10h10"/>
  <path d="M980 240v10a10 10 0 0 1-10 10h-10"/>
</g>

<g transform="translate(49,49)" fill="#FFFFFF">
  <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
</g>
<rect x="30" y="30" width="62" height="62" rx="16" fill="none" stroke="url(#sk-ac)" stroke-width="1.2" opacity="0.65"/>
<circle cx="61" cy="61" r="46" fill="url(#sk-ic)" opacity="0.5">
  <animate attributeName="opacity" values="0.25;0.6;0.25" dur="4.4s" repeatCount="indefinite"/>
</circle>

<text x="112" y="52" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#F8FAFC" letter-spacing="0.2">SkillUp · Task Management</text>
<text x="112" y="76" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#93A4CC">Full-stack academic platform for admins, faculty and students</text>

<rect x="742" y="26" width="228" height="24" rx="12" fill="url(#sk-chip)" stroke="#3730A3" stroke-width="1"/>
<circle cx="758" cy="38" r="3.5" fill="#818CF8"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="770" y="42" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#A5B4FC" letter-spacing="1.3">FULL STACK · 3 ROLE PORTALS</text>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#C9D3EC">
  <g fill="#818CF8">
    <path d="M116 112l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M116 136l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M116 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M116 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 112l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 136l3.4 3.4-3.4 3.4-3.4-3.4z"/>
    <path d="M414 160l3.4 3.4-3.4 3.4-3.4-3.4z"/><path d="M414 184l3.4 3.4-3.4 3.4-3.4-3.4z"/>
  </g>
  <text x="128" y="120">Admin, Faculty &amp; Student portals</text>
  <text x="128" y="144">Role-based access control + JWT auth</text>
  <text x="128" y="168">Course, batch &amp; user CRUD management</text>
  <text x="128" y="192">Task assignment, file upload, grading</text>
  <text x="426" y="120">Analytics dashboard built on Recharts</text>
  <text x="426" y="144">PDF report generation with filters</text>
  <text x="426" y="168">Platform settings &amp; maintenance mode</text>
  <text x="426" y="192">Deployed on Vercel + Render</text>
</g>

<rect x="716" y="62" width="254" height="140" rx="14" fill="#0B1130" fill-opacity="0.72" stroke="#3730A3" stroke-width="1"/>
<circle cx="736" cy="84" r="3.5" fill="#818CF8"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="748" y="88" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#A5B4FC" letter-spacing="1.4">SUBMISSION ANALYTICS</text>

<g stroke="#1E2A5E" stroke-width="1">
  <line x1="736" y1="120" x2="950" y2="120"/>
  <line x1="736" y1="148" x2="950" y2="148"/>
</g>

