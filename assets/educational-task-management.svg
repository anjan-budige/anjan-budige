  <rect x="783" y="0" width="18" height="46" rx="4"><animate attributeName="height" values="46;28;62;46" dur="3.8s" repeatCount="indefinite"/></rect>
  <rect x="817" y="0" width="18" height="38" rx="4"><animate attributeName="height" values="38;60;34;38" dur="2.9s" repeatCount="indefinite"/></rect>
  <rect x="851" y="0" width="18" height="56" rx="4"><animate attributeName="height" values="56;36;66;56" dur="4.1s" repeatCount="indefinite"/></rect>
