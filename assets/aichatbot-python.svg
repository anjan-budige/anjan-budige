<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="AI Banking Chatbot: Python, Flask, PyTorch, NLTK. Intent classification neural network with a decoupled Flask REST API and web chat frontend.">
